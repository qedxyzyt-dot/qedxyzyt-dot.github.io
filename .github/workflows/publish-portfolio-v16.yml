name: Publish portfolio V16 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site-v16/**"
      - ".github/workflows/publish-portfolio-v16.yml"
      - "better-notifications/**"
      - "easy-sign/**"
      - "select-anywhere/**"
      - "windows-companion/**"
      - "radar-brasil/**"
      - "pc/**"
      - "app-ads.txt"
      - "resume.pdf"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-portfolio"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (public repository)
        uses: actions/checkout@v6

      - name: Assemble curated site and preserve existing app routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a site-v16/. _site/
          for item in app-ads.txt resume.pdf better-notifications easy-sign select-anywhere windows-companion radar-brasil pc; do
            if [ -e "$item" ]; then cp -a "$item" _site/; fi
          done
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/cases/index.html
          test -s _site/assets/favicon-am.svg
          test -s _site/assets/og-portfolio-v16.png
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test -s _site/app-ads.txt
          test -s _site/better-notifications/privacy.html
          test -s _site/easy-sign/privacy-policy.html
          test -s _site/select-anywhere/privacy.html
          if find _site -type l | grep -q .; then
            echo "Symlink in Pages artifact: refusing deployment" >&2
            exit 1
          fi
          if find _site -type f \( -name '.env' -o -name '*.pem' -o -name '*.jks' -o -name '*.keystore' -o -name '*.p12' \) | grep -q .; then
            echo "Sensitive file extension found in Pages artifact" >&2
            exit 1
          fi
          echo "Assembled $(find _site -type f | wc -l) public files"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
